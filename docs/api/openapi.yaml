      x-veya-contract-source: PROPOSED
      x-veya-authorization: Authenticated user; the plan is created for the caller.
      x-veya-notes: 'One plan per user and date: a second POST for the same date returns 409. Adding items to an existing plan is not defined by the BA (AQ-3).'
      x-veya-open-questions: [AQ-3 adding items to an existing plan]
