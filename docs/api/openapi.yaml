                value:
                  date: '2026-11-18'
                  items:
                    - { itemType: WORKOUT, plannedTime: '18:00', exerciseId: 1, durationMin: 0 }
      responses:
        '201':
          description: Plan saved as version 1.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
              examples:
                planVersion1: { $ref: '#/components/examples/PlanVersion1' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A plan for this date already exists.
          content:
