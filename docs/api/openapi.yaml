components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT access token from `POST /api/v1/auth/login`, sent as `Authorization: Bearer <token>`. Lifetime/refresh: AQ-5 (open).'

  headers:
    Location:
      description: URL of the created resource.
      schema: { type: string, format: uri-reference }

  parameters:
    DatePath:
      name: date
      in: path
      required: true
      description: Local plan date (`YYYY-MM-DD`).
      schema: { type: string, format: date }
      example: '2026-11-16'
    DateQuery:
      name: date
      in: query
      required: true
      description: Local plan date (`YYYY-MM-DD`).
      schema: { type: string, format: date }
      example: '2026-11-16'
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 5e0c7f4a-1b2d-4c3e-9f8a-7b6c5d4e3f21
    ItemKey:
      name: itemKey
      in: path
      required: true
      description: Logical identity of a plan item; stays the same across versions.
      schema: { type: string, format: uuid }
      example: b0000000-0000-4000-8000-000000000203
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: c0000000-0000-4000-8000-000000000001
    FoodEntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 9d4e5f60-7182-4930-a4b5-c6d7e8f90a1b
    SavedMealId:
      name: savedMealId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: e0000000-0000-4000-8000-000000000001
    ConsentId:
      name: consentId
      in: path
      required: true
      schema: { type: string, format: uuid }
      example: 7a2d3b0f-4c8e-4f90-b2c3-d4e5f6071829
    Limit50:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    Limit100:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    ValidationFailed:
      description: Malformed JSON, invalid parameter or field values (nothing was changed).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/validation-failed', title: Request is not valid, status: 400, code: VALIDATION_FAILED, detail: One or more fields are invalid., instance: /api/v1/me/profile, errors: [{ field: energyTargetKcal, message: must be between 500 and 10000, rejectedValue: 100 }] }
    Unauthorized:
      description: Missing, invalid or expired token, or the account no longer exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/authentication-required', title: Authentication required, status: 401, code: AUTHENTICATION_REQUIRED, detail: A valid bearer token is required., instance: /api/v1/me }
    Forbidden:
      description: 'The resource belongs to another user (US-30, NFR-08). No data of that user is disclosed. OPEN (AQ-2): 403 for another user''s existing resource vs 404 - the database routines report "not found or not owned" as VY404, so the API must check ownership first; to be confirmed.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/access-denied', title: Access denied, status: 403, code: ACCESS_DENIED, detail: You cannot access this resource., instance: /api/v1/plans/5e0c7f4a-1b2d-4c3e-9f8a-7b6c5d4e3f21 }
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/resource-not-found', title: Not found, status: 404, code: RESOURCE_NOT_FOUND, detail: The requested resource does not exist., instance: /api/v1/plans/00000000-0000-4000-8000-000000000000 }
    StaleVersion:
      description: 'baseVersion is not the active plan version (NFR-10). Nothing changed; reload the plan and retry.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/stale-plan-version', title: Plan version is outdated, status: 409, code: STALE_PLAN_VERSION, detail: 'Stale plan version: expected 1, current 2.', instance: /api/v1/plans/5e0c7f4a-1b2d-4c3e-9f8a-7b6c5d4e3f21/items/b0000000-0000-4000-8000-000000000203/replacement, currentVersion: 2 }
    ItemAlreadyRecorded:
      description: The item is already completed/skipped/missed and is frozen (US-16).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/item-frozen', title: Item cannot be changed, status: 409, code: ITEM_FROZEN, detail: Completed or recorded items are frozen and cannot be replaced., instance: /api/v1/meal-options }
    StatusAlreadyRecorded:
      description: A status/record for this planned item already exists.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/status-already-recorded', title: Status already recorded, status: 409, code: STATUS_ALREADY_RECORDED, detail: Status of this workout is already recorded., instance: /api/v1/activity-entries }
    ImmutableHistory:
      description: The request tried to link to or change a superseded plan version.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/immutable-history', title: History cannot be changed, status: 409, code: IMMUTABLE_HISTORY, detail: Entries can only be linked to items of the active plan version., instance: /api/v1/food-entries }
    HardConstraintViolation:
      description: The requested item breaks a hard constraint (exclusion, ingredient, time or equipment).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/hard-constraint-violation', title: Hard constraint violated, status: 422, code: HARD_CONSTRAINT_VIOLATION, detail: 'Peanut butter toast contains PEANUT, which is excluded in your profile.', instance: /api/v1/plans, blockingConstraints: [{ type: FOOD_EXCLUSION, message: Contains PEANUT., itemKey: null }] }
    NoFeasibleAlternative:
      description: No compliant alternative exists (US-10 / US-14); the old plan stays active.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/no-feasible-alternative', title: No feasible alternative, status: 422, code: NO_FEASIBLE_ALTERNATIVE, detail: No meal fits the remaining time and exclusions., instance: /api/v1/meal-options, blockingConstraints: [{ type: TIME, message: Only 10 minutes are available for dinner preparation., itemKey: b0000000-0000-4000-8000-000000000203 }] }
    ProviderUnavailable:
      description: The external provider failed (5xx) and there are no local results (US-31). Manual entry stays available.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/provider-unavailable', title: Food provider unavailable, status: 502, code: PROVIDER_UNAVAILABLE, detail: The food provider is not available. You can enter the food manually., instance: '/api/v1/foods?q=quinoa', manualEntryAllowed: true }
    ProviderTimeout:
      description: The external provider timed out and there are no local results (US-05, US-31).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: 'https://veya.example/problems/provider-timeout', title: Food provider timed out, status: 504, code: PROVIDER_TIMEOUT, detail: The food provider did not answer in time. Retry or enter the food manually., instance: '/api/v1/foods?q=quinoa', manualEntryAllowed: true }

