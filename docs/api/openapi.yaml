      x-veya-contract-source: PROPOSED
      x-veya-authorization: Authenticated user; uses the caller's profile and constraints.
      x-veya-notes: 'Safe (no side effects) although POST is used for the request body. Deterministic for the same data. The combination of distinct meals closest to the energy target is accepted only within +/- veya.planning.target-tolerance-pct (default 20 %, AQ-14 PROPOSED). plannedTime is not suggested (omitted).'
