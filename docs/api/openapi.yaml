          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodEntryResult' }
              example:
                entry: { entryId: 9d4e5f60-7182-4930-a4b5-c6d7e8f90a1b, date: '2026-11-16', mealSlot: LUNCH, inputSource: MANUAL, foodId: null, savedMealId: null, planItemKey: b0000000-0000-4000-8000-000000000202, foodName: Office pizza (3 slices), portionG: 330.0, kcal: 879.9, proteinG: 32.0, fatG: 38.0, carbsG: 110.0, createdAt: '2026-11-16T12:40:00Z', updatedAt: '2026-11-16T12:40:00Z' }
