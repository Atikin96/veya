              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'https://veya.example/problems/plan-already-exists', title: Plan already exists, status: 409, code: PLAN_ALREADY_EXISTS, detail: A plan for 2026-11-17 already exists., instance: /api/v1/plans }
        '422': { $ref: '#/components/responses/HardConstraintViolation' }
