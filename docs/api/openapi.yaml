openapi: 3.1.0
info:
  title: VEYA REST API (MVP contract draft)
  version: 0.1.0-draft
  summary: Adaptive meal and physical-activity planning with Dynamic Plan Recovery.
  description: |
    **Draft contract for the VEYA MVP (27 Must user stories of the BA).**

    Implementation status (2026-11-23): all 45 operations are served by the backend and verified over real HTTP
    by the API integration tests, whose responses are validated against this document. **PARTIAL**: the recovery
    decision (ACCEPT/REJECT implemented; EDIT is blocked by Q12). The external food provider of `searchFoods` is
    optional and disabled by default (AQ-7). The status of each operation is in its `x-veya-status` extension and in the summary prefix
    `[IMPLEMENTED]` / `[PARTIAL]`.

    Sources: BA `docs/BA_Malafei_Mikita.docx` (Table 2.8, Appendix A, UC-01/UC-02, Fig. B.4/B.5, NFR, LEG),
    agreed decisions `docs/ba-open-questions.md` (Q1-Q13), database schema `docs/database/`.
    Paths and status codes taken from BA Table 2.8 are marked `x-veya-contract-source: BA`; everything else is
    `PROPOSED` and needs agreement between backend and frontend.

    Conventions (PROPOSED): JSON with camelCase fields; dates `YYYY-MM-DD` (the user's local plan date), times
    `HH:mm`, instants ISO-8601 UTC; errors are RFC 9457 Problem Details (`application/problem+json`) with a stable
    `code` (NFR-14); authentication with a JWT bearer token (BA §2.4, [25]).

    Open questions that affect this contract (details in `docs/api/API_ENDPOINTS.md`, section "Open questions"):
    **Q12** - meaning of EDIT (the EDIT decision is BLOCKED); **AQ-2** - 403 vs 404 for another user's resource;
    AQ-3 - adding items to a saved plan (no endpoint); AQ-4 to AQ-13 - proposed conventions to agree.

    Extensions used on operations: `x-veya-status`, `x-veya-module`, `x-veya-stories`, `x-veya-acceptance`,
    `x-veya-contract-source`, `x-veya-authorization`, `x-veya-notes`, `x-veya-open-questions`, `x-veya-postman`
    (test cases used to generate the Postman Collection).
  contact:
    name: VEYA team (backend - Mikita Malafei, frontend - Hanna Ivanova)
servers:
  - url: http://localhost:8080
    description: Local development (docker compose + ./mvnw spring-boot:run)
security:
  - bearerAuth: []
tags:
  - name: system
    description: Shared/system endpoints - health, API documentation, reference data (US-29, US-32, NFR-11).
  - name: identity
    description: Registration, sign-in, account, consent, export and deletion (US-01, US-04, US-30, LEG-2, LEG-4).
  - name: profile
    description: Profile, goal, permanent food exclusions and daily planning constraints (US-02, US-03).
  - name: nutrition
    description: Food catalogue search, diary, totals, saved/recent meals (US-05 to US-08, US-31).
  - name: planning
    description: Daily plans, plan items, meal plan suggestions, replacements, item status (US-09, US-10, US-12, US-14, US-15).
  - name: activity
    description: Exercise selection and actual workout records (US-12, US-13).
  - name: recovery
    description: Dynamic Plan Recovery - proposals, reasons, decisions, no-solution (US-16 to US-19).
  - name: history
    description: Day dashboard (US-20). History browsing (US-21) is post-MVP and not part of this contract.

paths:
  # ------------------------------------------------------------------------------------------------ system
  /actuator/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: '[IMPLEMENTED] Application health'
      description: Aggregated health of the API including the database connection. Details are never exposed.
      security: []
      x-veya-status: IMPLEMENTED
      x-veya-module: shared
      x-veya-stories: [US-32]
      x-veya-acceptance: 'US-32: given a clean machine with Docker, when Compose starts, PostgreSQL becomes healthy, migrations run and the API is ready. NFR-11 availability probe.'
      x-veya-contract-source: Spring Boot Actuator (configured in application.yml)
      x-veya-authorization: Public.
      x-veya-notes: Verified by HealthEndpointTests (actuator/health, liveness, readiness return 200 UP; env/beans/configprops are not exposed).
      x-veya-postman:
        - name: Health is UP
          expect: 200
          auth: none
      responses:
        '200':
          description: Application is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { groups: [liveness, readiness], status: UP }
        '503':
          description: Application or database is down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: DOWN }
  /actuator/health/liveness:
    get:
      tags: [system]
      operationId: getLiveness
      summary: '[IMPLEMENTED] Liveness probe'
      security: []
      x-veya-status: IMPLEMENTED
      x-veya-module: shared
      x-veya-stories: [US-32]
      x-veya-acceptance: 'US-32 / NFR-17: health checks before readiness.'
      x-veya-contract-source: Spring Boot Actuator
      x-veya-authorization: Public.
      x-veya-postman:
        - name: Liveness is UP
          expect: 200
          auth: none
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: UP }
  /actuator/health/readiness:
    get:
      tags: [system]
      operationId: getReadiness
      summary: '[IMPLEMENTED] Readiness probe'
      security: []
      x-veya-status: IMPLEMENTED
      x-veya-module: shared
      x-veya-stories: [US-32]
      x-veya-acceptance: 'US-32 / NFR-17: the API is ready only after migrations.'
      x-veya-contract-source: Spring Boot Actuator
      x-veya-authorization: Public.
      x-veya-postman:
        - name: Readiness is UP
          expect: 200
          auth: none
      responses:
        '200':
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: UP }
  /v3/api-docs:
    get:
      tags: [system]
      operationId: getApiDocs
      summary: '[IMPLEMENTED] OpenAPI document of the running API'
      description: This contract (`docs/api/openapi.yaml`, packaged into the backend at build time) served as JSON. Nothing is generated from the code; API tests check that the implemented controllers match it.
      security: []
      x-veya-status: IMPLEMENTED
      x-veya-module: shared
      x-veya-stories: [US-29]
      x-veya-acceptance: 'US-29: given a published build, when contract docs are generated, then every client-used method specifies path, auth, schemas, success and main error responses in OpenAPI.'
      x-veya-contract-source: PROPOSED (springdoc default path; served from this file)
      x-veya-authorization: Public in development; may be disabled in production (PROPOSED).
      x-veya-postman:
        - name: OpenAPI document is served
          expect: 200
          auth: none
      responses:
        '200':
          description: OpenAPI document.
          content:
            application/json:
              schema: { type: object }
              example: { openapi: 3.1.0, info: { title: VEYA REST API, version: 0.1.0 } }
  /api/v1/reference-data:
    get:
      tags: [system]
      operationId: getReferenceData
      summary: '[IMPLEMENTED] Reference vocabularies for forms'
      description: Goals, meal slots, equipment and ingredients used by profile, constraint, diary and plan forms.
      x-veya-status: IMPLEMENTED
      x-veya-module: shared
      x-veya-stories: [US-02, US-03, US-06]
      x-veya-acceptance: 'Supports US-02 (goal), US-03 (exclusions, equipment), US-06 (meal slot) forms with valid codes.'
      x-veya-contract-source: PROPOSED
      x-veya-authorization: Any authenticated user; data is not personal.
      x-veya-notes: Small and stable; the client may cache it for the session.
      x-veya-postman:
        - name: Reference data
          expect: 200
        - name: Reference data without token
          expect: 401
          auth: none
      responses:
        '200':
          description: Reference vocabularies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceData' }
              example:
                goals: [{ code: LOSE_WEIGHT, name: Lose weight }, { code: MAINTAIN_WEIGHT, name: Maintain weight }, { code: GAIN_WEIGHT, name: Gain weight / build muscle }]
                mealSlots: [{ code: BREAKFAST, name: Breakfast, sortOrder: 1 }, { code: LUNCH, name: Lunch, sortOrder: 2 }, { code: DINNER, name: Dinner, sortOrder: 3 }, { code: SNACK, name: Snack, sortOrder: 4 }]
                equipment: [{ code: DUMBBELLS, name: Dumbbells }, { code: YOGA_MAT, name: Yoga mat }]
                ingredients: [{ code: PEANUT, name: Peanut }, { code: FISH, name: Fish }, { code: MILK, name: Milk / dairy }]
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------------------------------------- identity
  /api/v1/auth/register:
    post:
      tags: [identity]
      operationId: register
      summary: '[IMPLEMENTED] Register a new account'
      description: |
        Creates an account with a securely hashed password (bcrypt/Argon2id). Registration requires the explicit
        "I am at least 18" confirmation (Q8, Q13) and acceptance of the consent documents listed by
        `GET /api/v1/consent-documents` (LEG-2, Q7). Does not sign the user in.
      security: []
      x-veya-status: IMPLEMENTED
      x-veya-module: identity
      x-veya-stories: [US-01]
      x-veya-acceptance: 'US-01: given valid registration data, when submitted, then the account is created with a securely hashed password.'
      x-veya-contract-source: PROPOSED
      x-veya-authorization: Public.
      x-veya-notes: 'Not idempotent: a repeated request with the same e-mail returns 409. Password 8-72 characters (bcrypt limit) - PROPOSED.'
      x-veya-open-questions: [AQ-4 consents required at registration, AQ-6 duplicate e-mail disclosure]
      x-veya-postman:
        - name: Register (Anna)
          expect: 201
          auth: none
          saveFrom: { userId: userId }
        - name: Register without adult confirmation
          expect: 400
          auth: none
          example: missingAdultConfirmation
        - name: Register with an existing e-mail
          expect: 409
          auth: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            examples:
              valid:
                summary: Valid registration
                value: { email: anna.demo@example.org, password: '<your-password>', adultConfirmed: true, consentDocumentIds: [1, 2] }
              missingAdultConfirmation:
                summary: Adult confirmation missing (400)
                value: { email: teen@example.org, password: '<your-password>', adultConfirmed: false, consentDocumentIds: [1, 2] }
      responses:
        '201':
          description: Account created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
              example: { userId: a0000000-0000-4000-8000-000000000001, email: anna.demo@example.org, adultConfirmedAt: '2026-11-22T09:00:00Z', createdAt: '2026-11-22T09:00:00Z', hasProfile: false }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '409':
          description: E-mail already registered (PROPOSED - see AQ-6).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'https://veya.example/problems/email-already-registered', title: E-mail already registered, status: 409, code: EMAIL_ALREADY_REGISTERED, detail: An account with this e-mail already exists., instance: /api/v1/auth/register }
  /api/v1/auth/login:
    post:
      tags: [identity]
      operationId: login
      summary: '[IMPLEMENTED] Sign in and obtain a JWT'
      security: []
      x-veya-status: IMPLEMENTED
      x-veya-module: identity
      x-veya-stories: [US-01, US-30]
      x-veya-acceptance: 'US-01: invalid credentials return 401 without disclosing the account state.'
      x-veya-contract-source: PROPOSED
      x-veya-authorization: Public.
      x-veya-notes: The same 401 response for an unknown e-mail and a wrong password. Token lifetime and refresh are open (AQ-5).
      x-veya-open-questions: [AQ-5 token lifetime and refresh]
      x-veya-postman:
        - name: Sign in (Anna)
          expect: 200
          auth: none
          saveFrom: { accessToken: accessToken }
        - name: Sign in with a wrong password
          expect: 401
          auth: none
          example: wrongPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              valid:
                summary: Valid credentials
                value: { email: anna.demo@example.org, password: '<your-password>' }
              wrongPassword:
                summary: Wrong password (401)
                value: { email: anna.demo@example.org, password: definitely-wrong }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example: { accessToken: '<jwt>', tokenType: Bearer, expiresIn: 3600 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: Invalid credentials. The response is identical whether the account exists or not.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'https://veya.example/problems/invalid-credentials', title: Invalid credentials, status: 401, code: INVALID_CREDENTIALS, detail: E-mail or password is incorrect., instance: /api/v1/auth/login }
  /api/v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: '[IMPLEMENTED] Current account'
      x-veya-status: IMPLEMENTED
      x-veya-module: identity
      x-veya-stories: [US-01, US-30]
      x-veya-acceptance: 'US-30: missing/invalid token returns 401 without disclosing personal data.'
      x-veya-contract-source: PROPOSED
      x-veya-authorization: Authenticated user; returns only the caller's own account. Never returns the password hash.
      x-veya-postman:
        - name: Current account
          expect: 200
        - name: Current account without token
          expect: 401
          auth: none
        - name: Current account with an invalid token
          expect: 401
          auth: invalid
      responses:
        '200':
          description: Account of the authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
              example: { userId: a0000000-0000-4000-8000-000000000001, email: anna.demo@example.org, adultConfirmedAt: '2026-11-01T08:00:00Z', createdAt: '2026-11-01T08:00:00Z', hasProfile: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [identity]
      operationId: deleteMyAccount
      summary: '[IMPLEMENTED] Delete my account and personal records'
      description: |
        Erases the account and all personal records (profile, consents, constraints, diary, plans, proposals,
        decisions) through ON DELETE CASCADE. Requires explicit confirmation `confirm=true`, which the client sends
        only after the user confirmed in the UI. Afterwards every previously issued token is rejected with 401.
      x-veya-status: IMPLEMENTED
      x-veya-module: identity
      x-veya-stories: [US-04]
      x-veya-acceptance: 'US-04: given explicit confirmation, when deletion completes, then associated personal records are deleted under the retention policy and the previous session cannot access them.'
      x-veya-contract-source: PROPOSED
      x-veya-authorization: Authenticated user; deletes only the caller's own account.
      x-veya-notes: 'Idempotent from the client view: after deletion the token is invalid, so a repeat returns 401. LEG-4 backup expiry (90 days) is operational, not part of the API.'
      x-veya-postman:
        - name: Delete account without confirmation
          expect: 400
          query: { confirm: 'false' }
        - name: Delete my account (run last)
          expect: 204
          destructive: true
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must be `true` - explicit confirmation given by the user.
          schema: { type: boolean, const: true }
          example: true
      responses:
        '204': { description: Account and personal records deleted. }
        '400':
          description: Confirmation missing.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'https://veya.example/problems/confirmation-required', title: Confirmation required, status: 400, code: CONFIRMATION_REQUIRED, detail: Account deletion requires confirm=true., instance: /api/v1/me }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/export:
    get:
      tags: [identity]
      operationId: exportMyData
      summary: '[IMPLEMENTED] Export my data as JSON (LEG-4)'
      description: Minimal JSON export of the caller's own records (Q6), produced by the database function `export_user_data`. Contains no password hash.
      x-veya-status: IMPLEMENTED
      x-veya-module: identity
      x-veya-stories: [US-04]
      x-veya-acceptance: 'LEG-4: support access, correction, export and deletion (agreed decision Q6: minimal JSON export). This is not US-36 (CSV, Could).'
      x-veya-contract-source: PROPOSED (decision Q6)
      x-veya-authorization: Authenticated user; only own data.
      x-veya-postman:
        - name: Export my data
          expect: 200
      responses:
        '200':
          description: Export document.
          headers:
            Content-Disposition:
              description: Suggests a file name to the browser.
              schema: { type: string }
              example: attachment; filename="veya-export.json"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
              example:
                exportedAt: '2026-11-22T10:00:00Z'
                account: { id: a0000000-0000-4000-8000-000000000001, email: anna.demo@example.org, createdAt: '2026-11-01T08:00:00Z', adultConfirmedAt: '2026-11-01T08:00:00Z' }
                profile: { goal_code: LOSE_WEIGHT, energy_target_kcal: 1900 }
                foodExclusions: [PEANUT]
                consents: [{ type: PRIVACY_NOTICE, version: '1.0', grantedAt: '2026-11-01T08:00:00Z', withdrawnAt: null }]
                dailyConstraints: []
                foodEntries: []
                activityEntries: []
                savedMeals: []
                plans: []
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/consent-documents:
    get:
      tags: [identity]
      operationId: listConsentDocuments
      summary: '[IMPLEMENTED] Current privacy notice and consent texts'
      description: Versioned documents the user accepts at registration (LEG-2, Q7). Public, needed before sign-up.
      security: []
      x-veya-status: IMPLEMENTED
      x-veya-module: identity
      x-veya-stories: [US-01]
      x-veya-acceptance: 'LEG-2: display a clear privacy notice; obtain explicit, separately recorded and versioned consent.'
      x-veya-contract-source: PROPOSED (decision Q7)
      x-veya-authorization: Public.
      x-veya-postman:
        - name: Consent documents
          expect: 200
          auth: none
      responses:
        '200':
          description: Current document versions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConsentDocument' }
              example:
                - { consentDocumentId: 1, consentType: PRIVACY_NOTICE, version: '1.0', publishedOn: '2026-11-01', summary: 'VEYA privacy notice: purposes, legal bases (Art. 6(1)(b)), retention and user rights.' }
                - { consentDocumentId: 2, consentType: HEALTH_DATA_CONSENT, version: '1.0', publishedOn: '2026-11-01', summary: Explicit consent to process nutrition and activity records that may be health data (Art. 9(2)(a)). }
  /api/v1/me/consents:
    get:
      tags: [identity]
      operationId: listMyConsents
      summary: '[IMPLEMENTED] My consent records'
      x-veya-status: IMPLEMENTED
      x-veya-module: identity
      x-veya-stories: [US-01]
      x-veya-acceptance: 'LEG-2 / Q7: separate consent record with version and time.'
      x-veya-contract-source: PROPOSED (decision Q7)
      x-veya-authorization: Authenticated user; only own consents.
      x-veya-postman:
        - name: My consents
          expect: 200
          saveFrom: { consentId: '0.consentId' }
      responses:
        '200':
          description: Consent records, active and withdrawn.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserConsent' }
              example:
                - { consentId: 6f1c2a9e-3b7d-4e8f-a1b2-c3d4e5f60718, consentDocumentId: 1, consentType: PRIVACY_NOTICE, version: '1.0', grantedAt: '2026-11-01T08:00:00Z', withdrawnAt: null }
                - { consentId: 7a2d3b0f-4c8e-4f90-b2c3-d4e5f6071829, consentDocumentId: 2, consentType: HEALTH_DATA_CONSENT, version: '1.0', grantedAt: '2026-11-01T08:01:00Z', withdrawnAt: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [identity]
      operationId: grantConsent
      summary: '[IMPLEMENTED] Accept a consent document version'
      description: Records acceptance of a (new) document version, e.g. after the privacy notice was updated.
      x-veya-status: IMPLEMENTED
      x-veya-module: identity
      x-veya-stories: [US-01]
      x-veya-acceptance: 'LEG-2: explicit, separately recorded and versioned consent.'
      x-veya-contract-source: PROPOSED (decision Q7)
      x-veya-authorization: Authenticated user; records consent only for the caller.
      x-veya-postman:
        - name: Accept a consent document that is already active
          expect: 409
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantConsentRequest' }
            example: { consentDocumentId: 2 }
      responses:
        '201':
          description: Consent recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserConsent' }
              example: { consentId: 8b3e4c1a-5d9f-4a01-c3d4-e5f60718293a, consentDocumentId: 2, consentType: HEALTH_DATA_CONSENT, version: '1.0', grantedAt: '2026-11-22T10:05:00Z', withdrawnAt: null }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An active consent for this document version already exists.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'https://veya.example/problems/consent-already-active', title: Consent already active, status: 409, code: CONSENT_ALREADY_ACTIVE, detail: Consent to HEALTH_DATA_CONSENT 1.0 is already active., instance: /api/v1/me/consents }
  /api/v1/me/consents/{consentId}/withdrawal:
    post:
      tags: [identity]
      operationId: withdrawConsent
      summary: '[IMPLEMENTED] Withdraw a consent'
      description: Records the withdrawal time (allowed once). What the application does after the health-data consent is withdrawn is an open question (AQ-4).
      x-veya-status: IMPLEMENTED
      x-veya-module: identity
      x-veya-stories: [US-01]
      x-veya-acceptance: 'LEG-2 consent; GDPR withdrawal. Database allows exactly one withdrawal per record.'
      x-veya-contract-source: PROPOSED (decision Q7)
      x-veya-authorization: Authenticated user; only own consent records (another user's record -> 403).
      x-veya-open-questions: [AQ-4 consequences of withdrawing health-data consent]
      x-veya-postman:
        - name: Withdraw a consent
          expect: 200
        - name: Withdraw the same consent again
          expect: 409
      parameters:
        - { $ref: '#/components/parameters/ConsentId' }
      responses:
        '200':
          description: Consent withdrawn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserConsent' }
              example: { consentId: 7a2d3b0f-4c8e-4f90-b2c3-d4e5f6071829, consentDocumentId: 2, consentType: HEALTH_DATA_CONSENT, version: '1.0', grantedAt: '2026-11-01T08:01:00Z', withdrawnAt: '2026-11-22T10:10:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already withdrawn.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'https://veya.example/problems/consent-already-withdrawn', title: Consent already withdrawn, status: 409, code: CONSENT_ALREADY_WITHDRAWN, detail: This consent was withdrawn on 2026-11-22., instance: /api/v1/me/consents/7a2d3b0f-4c8e-4f90-b2c3-d4e5f6071829/withdrawal }

  # ----------------------------------------------------------------------------------------------- profile
  /api/v1/me/profile:
    get:
      tags: [profile]
      operationId: getMyProfile
      summary: '[IMPLEMENTED] My profile and goal'
      x-veya-status: IMPLEMENTED
      x-veya-module: profile
      x-veya-stories: [US-02]
      x-veya-acceptance: 'US-02: given authenticated, valid values, when saved, then the profile appears on subsequent requests.'
      x-veya-contract-source: PROPOSED
      x-veya-authorization: Authenticated user; own profile only.
      x-veya-postman:
        - name: My profile
          expect: 200
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
              example: { goal: LOSE_WEIGHT, energyTargetKcal: 1900, proteinTargetG: 110.0, fatTargetG: 60.0, carbsTargetG: 220.0, foodExclusions: [PEANUT], updatedAt: '2026-11-01T08:05:00Z' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The user has not created a profile yet.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'https://veya.example/problems/profile-not-found', title: Profile not found, status: 404, code: PROFILE_NOT_FOUND, detail: Create the profile with PUT /api/v1/me/profile., instance: /api/v1/me/profile }
    put:
      tags: [profile]
      operationId: saveMyProfile
      summary: '[IMPLEMENTED] Create or update my profile, goal and permanent exclusions'
      description: |
        Stores the goal, daily targets entered by the user (not calculated - no BMR/TDEE) and permanent food
        exclusions (Q5). Invalid ranges return field errors and do not change stored data.
      x-veya-status: IMPLEMENTED
      x-veya-module: profile
      x-veya-stories: [US-02, US-03]
      x-veya-acceptance: 'US-02: invalid ranges return a field error and do not change stored data. US-03: exclusions are mandatory conditions for meal, activity and recovery planning.'
      x-veya-contract-source: PROPOSED
      x-veya-authorization: Authenticated user; own profile only.
      x-veya-notes: Idempotent (PUT replaces the whole profile including the exclusion list).
      x-veya-postman:
        - name: Save my profile
          expect: 200
        - name: Save profile with an out-of-range energy target
          expect: 400
          example: invalidRange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileRequest' }
            examples:
              valid:
                summary: Valid profile
                value: { goal: LOSE_WEIGHT, energyTargetKcal: 1900, proteinTargetG: 110, fatTargetG: 60, carbsTargetG: 220, foodExclusions: [PEANUT] }
              invalidRange:
                summary: Energy target out of range (400)
                value: { goal: LOSE_WEIGHT, energyTargetKcal: 100, proteinTargetG: 110, fatTargetG: 60, carbsTargetG: 220, foodExclusions: [] }
      responses:
        '200':
          description: Profile saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
              example: { goal: LOSE_WEIGHT, energyTargetKcal: 1900, proteinTargetG: 110.0, fatTargetG: 60.0, carbsTargetG: 220.0, foodExclusions: [PEANUT], updatedAt: '2026-11-22T10:15:00Z' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/constraints/{date}:
    get:
      tags: [profile]
      operationId: getDailyConstraints
      summary: '[IMPLEMENTED] Planning constraints of a day'
      description: Returns the day's constraints; a day without saved constraints returns empty lists and `availableTimeMin = null` (PROPOSED).
      x-veya-status: IMPLEMENTED
      x-veya-module: profile
      x-veya-stories: [US-03]
      x-veya-acceptance: 'US-03: given valid daily constraints, when saved, then they are stored and treated as mandatory conditions.'
      x-veya-contract-source: PROPOSED
      x-veya-authorization: Authenticated user; own constraints only.
      x-veya-postman:
        - name: Constraints of the day
          expect: 200
      parameters:
        - { $ref: '#/components/parameters/DatePath' }
      responses:
        '200':
          description: Constraints of the day.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyConstraints' }
              example: { date: '2026-11-16', availableTimeMin: 40, availableEquipment: [], availableIngredients: [], excludedIngredients: [FISH] }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [profile]
      operationId: saveDailyConstraints
      summary: '[IMPLEMENTED] Save planning constraints of a day'
      description: |
        Saves available time, equipment, available ingredients and temporary exclusions (Q3, Q5). If the change
        makes a remaining planned item infeasible, the backend records a `CONSTRAINT_INFEASIBLE` deviation and the
        response reports `recoveryRequired = true` with the affected items (US-15 rule 3). The plan itself is not
        changed.
      x-veya-status: IMPLEMENTED
      x-veya-module: profile
      x-veya-stories: [US-03, US-15]
      x-veya-acceptance: 'US-03 (stored, mandatory conditions); US-15: changed time/ingredients/equipment that make a future slot infeasible set recoveryRequired.'
      x-veya-contract-source: PROPOSED
      x-veya-authorization: Authenticated user; own constraints only.
      x-veya-notes: 'Idempotent (PUT replaces the day''s constraints; a deviation is recorded once per item). Infeasibility rule implemented as PROPOSED in AQ-13 (needs approval).'
      x-veya-open-questions: [AQ-13 rule for infeasible future items]
      x-veya-postman:
        - name: Save constraints (fish unavailable, 40 min)
          expect: 200
        - name: Save constraints with negative time
          expect: 400
          example: invalidTime
      parameters:
        - { $ref: '#/components/parameters/DatePath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailyConstraintsRequest' }
            examples:
              valid:
                summary: Fish unavailable, 40 minutes, no equipment
                value: { availableTimeMin: 40, availableEquipment: [], availableIngredients: [], excludedIngredients: [FISH] }
              invalidTime:
                summary: Negative available time (400)
                value: { availableTimeMin: -5, availableEquipment: [], availableIngredients: [], excludedIngredients: [] }
      responses:
        '200':
          description: Constraints saved; impact on the active plan of that day.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyConstraintsResult' }
              example:
                constraints: { date: '2026-11-16', availableTimeMin: 40, availableEquipment: [], availableIngredients: [], excludedIngredients: [FISH] }
                planImpact: { planId: 5e0c7f4a-1b2d-4c3e-9f8a-7b6c5d4e3f21, recoveryRequired: true, infeasibleItems: [{ itemKey: b0000000-0000-4000-8000-000000000203, reason: 'Planned dinner contains fish, which is excluded for 2026-11-16.' }] }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --------------------------------------------------------------------------------------------- nutrition
  /api/v1/foods:
    get:
      tags: [nutrition]
      operationId: searchFoods
      summary: '[IMPLEMENTED] Search the food catalogue'
      description: |
        Case-insensitive substring search over the local catalogue and the external food provider, normalized to
        calories and macros per 100 g with the source (US-05). If the provider fails but local results exist, the
        response is 200 with `providerStatus = UNAVAILABLE` (R1 fallback, PROPOSED). If the provider times out and
        there are no local results, 504 with `manualEntryAllowed = true` (US-05, US-31).
      x-veya-status: IMPLEMENTED
      x-veya-module: nutrition
      x-veya-stories: [US-05, US-31]
      x-veya-acceptance: 'US-05: given a reachable provider, when the user searches, then normalized foods show calories, macros and source; timeout produces a documented error and manual-input option. US-31: stable error code and safe retry/manual route.'
      x-veya-contract-source: PROPOSED
      x-veya-authorization: Authenticated user; catalogue data is not personal.
      x-veya-notes: 'Provider: Open Food Facts adapter (2 s timeout), disabled by default - enable with VEYA_FOOD_PROVIDER_ENABLED=true (AQ-7: provider choice open). Provider products are cached in the local catalogue (source PROVIDER, attribution set). Fallback as described above, verified against a stub provider in the tests; without a configured provider the result is local only with providerStatus UNAVAILABLE. Sorted by relevance (names starting with the text first, then name). `limit` 1-50, default 20; no pagination (bounded result).'
      x-veya-open-questions: [AQ-7 provider fallback behaviour]
      x-veya-postman:
        - name: Search foods "chick"
          expect: 200
        - name: Search with a one-letter query
          expect: 400
          query: { q: c }
      parameters:
        - name: q
          in: query
          required: true
          description: Search text, 2-100 characters.
          schema: { type: string, minLength: 2, maxLength: 100 }
          example: chick
        - { $ref: '#/components/parameters/Limit50' }
      responses:
        '200':
          description: Matching foods.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodSearchResult' }
              example:
                providerStatus: OK
                items: [{ foodId: 4, name: 'Chicken breast, cooked', source: LOCAL, kcalPer100g: 165.0, proteinPer100g: 31.0, fatPer100g: 3.6, carbsPer100g: 0.0, attribution: null }]
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/ProviderUnavailable' }
        '504': { $ref: '#/components/responses/ProviderTimeout' }
