  # ---------------------------------------------------------------------------------------------- recovery
  /api/v1/plans/{planId}/recovery-proposals:
    post:
      tags: [recovery]
      operationId: createRecoveryProposal
      summary: '[IMPLEMENTED] Generate a recovery proposal for the remaining day'
      description: |
        UC-01 steps 4-5. The engine loads the active version, freezes completed items, derives remaining targets
        from confirmed facts, filters candidates by hard constraints and ranks feasible combinations. The proposal
        is stored with `baseVersion` and a human-readable reason per changed item. **The active plan does not
        change** - it changes only after an explicit decision. No feasible combination -> 422 with
        `blockingConstraints` and no new version (US-19).
      x-veya-status: IMPLEMENTED
      x-veya-module: recovery
      x-veya-stories: [US-16, US-17, US-19]
      x-veya-acceptance: 'US-16: given a recoveryRequired plan, when requested, then completed items are frozen and feasible future combinations are returned with totals or an explicit no-solution response. US-17: each changed item has a human-readable reason. US-19: no feasible combination -> blockingConstraints and 422, no new plan version.'
      x-veya-contract-source: BA Table 2.8 (201 proposalId, baseVersion, changed items, totals and reasons; 422 if impossible) + Q1 (201 Created)
      x-veya-authorization: Authenticated user; another user's plan -> 403.
      x-veya-notes: 'Not idempotent - each call stores a new proposal. Response time target p95 <= 2 s (NFR-02), visible <= 3 s (KPI-4). The request body is optional. Engine: frozen items kept; remaining kcal target = profile target - confirmed diary kcal; meals ranked by |remaining target - planned kcal| + 50 kcal per changed meal; infeasible workouts replaced or removed; a skipped/missed workout gets one feasible ADD (plannedTime null). 422 RECOVERY_NOT_FEASIBLE also when no feasible change improves the remaining plan. Totals are recomputed from current confirmed records when the proposal is read.'
      x-veya-postman:
        - name: Generate a recovery proposal
          expect: 201
          bodyVars: { baseVersion: planVersion }
          saveFrom: { proposalId: proposalId, proposalBaseVersion: baseVersion, firstChangeId: 'changes.0.changeId' }
        - name: Generate a second proposal (for the stale case)
          expect: 201
          bodyVars: { baseVersion: planVersion }
          saveFrom: { staleProposalId: proposalId }
        - name: Recovery when nothing is feasible
          expect: 422
        - name: Recovery when it is not required
          expect: 409
        - name: Recovery for another user's plan
          expect: 403
          auth: other
      parameters:
        - { $ref: '#/components/parameters/PlanId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRecoveryProposalRequest' }
            example: { baseVersion: 1 }
      responses:
        '201':
          description: Proposal stored; the plan is unchanged.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryProposal' }
              examples:
                recoveryProposalPending: { $ref: '#/components/examples/RecoveryProposalPending' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Recovery is not required for this plan, or the client's baseVersion is stale.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                notRequired:
                  value: { type: 'https://veya.example/problems/recovery-not-required', title: Recovery not required, status: 409, code: RECOVERY_NOT_REQUIRED, detail: No significant deviation is open for this plan., instance: /api/v1/plans/5e0c7f4a-1b2d-4c3e-9f8a-7b6c5d4e3f21/recovery-proposals }
                stale:
                  value: { type: 'https://veya.example/problems/stale-plan-version', title: Plan version is outdated, status: 409, code: STALE_PLAN_VERSION, detail: 'Stale baseVersion 1: active plan version is 2.', instance: /api/v1/plans/5e0c7f4a-1b2d-4c3e-9f8a-7b6c5d4e3f21/recovery-proposals, currentVersion: 2 }
        '422':
          description: No feasible combination (US-19). No proposal and no new plan version are created.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: 'https://veya.example/problems/recovery-not-feasible'
                title: No feasible recovery
                status: 422
                code: RECOVERY_NOT_FEASIBLE
                detail: No combination of remaining meals and workouts satisfies your constraints.
                instance: /api/v1/plans/5e0c7f4a-1b2d-4c3e-9f8a-7b6c5d4e3f21/recovery-proposals
                blockingConstraints:
                  - { type: TIME, message: Only 10 minutes are available; every remaining item needs at least 20., itemKey: null }
                  - { type: FOOD_EXCLUSION, message: All dinner candidates contain fish or peanut., itemKey: b0000000-0000-4000-8000-000000000203 }
