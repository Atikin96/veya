            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'https://veya.example/problems/no-feasible-meal-plan', title: No feasible meal plan, status: 422, code: NO_FEASIBLE_MEAL_PLAN, detail: No candidate meals satisfy your exclusions for DINNER., instance: /api/v1/meal-plan-suggestions, blockingConstraints: [{ type: FOOD_EXCLUSION, message: All dinner candidates contain excluded ingredients., itemKey: null }] }
