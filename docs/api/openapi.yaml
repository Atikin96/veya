  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }
        groups: { type: array, items: { type: string } }
    Problem:
      type: object
      description: RFC 9457 Problem Details with VEYA extensions. Content type `application/problem+json`.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, description: Problem type URI (stable per code). }
        title: { type: string, description: Short human-readable summary. }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Human-readable explanation of this occurrence. }
        instance: { type: string, description: Request path of this occurrence. }
        code: { $ref: '#/components/schemas/ErrorCode' }
        errors:
          type: array
          description: Field errors for VALIDATION_FAILED.
          items: { $ref: '#/components/schemas/FieldError' }
        blockingConstraints:
          type: array
          description: Constraints that make the request infeasible (422).
          items: { $ref: '#/components/schemas/BlockingConstraint' }
        currentVersion:
          type: integer
          minimum: 1
          description: Active plan version, returned with STALE_PLAN_VERSION.
        manualEntryAllowed:
          type: boolean
          description: Provider errors - the client may offer manual entry.
        traceId:
          type: string
          description: Request ID for support (NFR-18, PROPOSED).
    ErrorCode:
      type: string
      description: Stable error codes (NFR-14). PROPOSED list.
      enum: [VALIDATION_FAILED, MALFORMED_REQUEST, CONFIRMATION_REQUIRED, INVALID_EDIT, AUTHENTICATION_REQUIRED, INVALID_CREDENTIALS, ACCESS_DENIED, RESOURCE_NOT_FOUND, PROFILE_NOT_FOUND, PLAN_NOT_FOUND, EMAIL_ALREADY_REGISTERED, CONSENT_ALREADY_ACTIVE, CONSENT_ALREADY_WITHDRAWN, SAVED_MEAL_NAME_TAKEN, PLAN_ALREADY_EXISTS, STALE_PLAN_VERSION, PROPOSAL_ALREADY_DECIDED, RECOVERY_NOT_REQUIRED, ITEM_FROZEN, STATUS_ALREADY_RECORDED, IMMUTABLE_HISTORY, HARD_CONSTRAINT_VIOLATION, NO_FEASIBLE_ALTERNATIVE, NO_FEASIBLE_MEAL_PLAN, RECOVERY_NOT_FEASIBLE, PROVIDER_UNAVAILABLE, PROVIDER_TIMEOUT, INTERNAL_ERROR]
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: 'JSON path of the field, e.g. `items[2].mealId`.' }
        message: { type: string }
        rejectedValue: { description: The rejected value (never for passwords). }
    BlockingConstraint:
      type: object
      required: [type, message]
      properties:
        type: { type: string, enum: [TIME, EQUIPMENT, INGREDIENT, FOOD_EXCLUSION, NUTRITION_TARGET] }
        message: { type: string }
        itemKey: { type: [string, 'null'], format: uuid, description: 'Affected plan item, if any.' }

    Code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,29}$' }
    MealSlot: { type: string, enum: [BREAKFAST, LUNCH, DINNER, SNACK], description: 'Codes from `meal_slot`.' }
    Goal: { type: string, enum: [LOSE_WEIGHT, MAINTAIN_WEIGHT, GAIN_WEIGHT], description: 'Codes from `goal_type`.' }
    LocalDate: { type: string, format: date, examples: ['2026-11-16'] }
    LocalTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['19:30'] }
    Kcal: { type: number, minimum: 0, maximum: 10000, description: 'kcal, stored with one decimal place (numeric(7,1)).' }
    Grams: { type: number, minimum: 0, maximum: 1000, description: 'grams, stored with one decimal place.' }
    Macros:
      type: object
      required: [kcal, proteinG, fatG, carbsG]
      properties:
        kcal: { $ref: '#/components/schemas/Kcal' }
        proteinG: { $ref: '#/components/schemas/Grams' }
        fatG: { $ref: '#/components/schemas/Grams' }
        carbsG: { $ref: '#/components/schemas/Grams' }
    NullableMacros:
      type: object
      properties:
        kcal: { type: [number, 'null'] }
        proteinG: { type: [number, 'null'] }
        fatG: { type: [number, 'null'] }
        carbsG: { type: [number, 'null'] }
    CodeName:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        name: { type: string }
    ReferenceData:
      type: object
      required: [goals, mealSlots, equipment, ingredients]
      properties:
        goals: { type: array, items: { $ref: '#/components/schemas/CodeName' } }
        mealSlots:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/CodeName' }
              - type: object
                required: [sortOrder]
                properties: { sortOrder: { type: integer, minimum: 1 } }
        equipment: { type: array, items: { $ref: '#/components/schemas/CodeName' } }
        ingredients: { type: array, items: { $ref: '#/components/schemas/CodeName' } }

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, adultConfirmed, consentDocumentIds]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72, writeOnly: true, description: Plain password over HTTPS; stored only as a bcrypt/Argon2id hash. Length rule PROPOSED. }
        adultConfirmed: { type: boolean, const: true, description: 'Explicit "I am at least 18" confirmation (Q8, Q13). Stored as adultConfirmedAt.' }
        consentDocumentIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Accepted documents from GET /api/v1/consent-documents. Which ones are mandatory is AQ-4 (PROPOSED - both current versions).
          items: { type: integer, minimum: 1 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string, description: JWT; the subject is the user id. }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, minimum: 1, description: Seconds until expiry (PROPOSED 3600). }
    Account:
      type: object
      required: [userId, email, adultConfirmedAt, createdAt, hasProfile]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }
        adultConfirmedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        hasProfile: { type: boolean }
    DataExport:
      type: object
      description: Output of the database function export_user_data (LEG-4, Q6). Nested record objects use the database column names (snake_case). No password hash.
      required: [exportedAt, account, consents, foodEntries, activityEntries, savedMeals, plans]
      properties:
        exportedAt: { type: string, format: date-time }
        account: { type: object }
        profile: { type: [object, 'null'] }
        foodExclusions: { type: array, items: { type: string } }
        consents: { type: array, items: { type: object } }
        dailyConstraints: { type: array, items: { type: object } }
        foodEntries: { type: array, items: { type: object } }
        activityEntries: { type: array, items: { type: object } }
        savedMeals: { type: array, items: { type: object } }
        plans: { type: array, items: { type: object } }
    ConsentDocument:
      type: object
      required: [consentDocumentId, consentType, version, publishedOn, summary]
      properties:
        consentDocumentId: { type: integer, minimum: 1 }
        consentType: { type: string, enum: [PRIVACY_NOTICE, HEALTH_DATA_CONSENT] }
        version: { type: string, pattern: '^[0-9]+\.[0-9]+$' }
        publishedOn: { type: string, format: date }
        summary: { type: string }
    UserConsent:
      type: object
      required: [consentId, consentDocumentId, consentType, version, grantedAt, withdrawnAt]
      properties:
        consentId: { type: string, format: uuid }
        consentDocumentId: { type: integer }
        consentType: { type: string, enum: [PRIVACY_NOTICE, HEALTH_DATA_CONSENT] }
        version: { type: string }
        grantedAt: { type: string, format: date-time }
        withdrawnAt: { type: [string, 'null'], format: date-time }
    GrantConsentRequest:
      type: object
      additionalProperties: false
      required: [consentDocumentId]
      properties:
        consentDocumentId: { type: integer, minimum: 1 }

    ProfileRequest:
      type: object
      required: [goal, energyTargetKcal, proteinTargetG, fatTargetG, carbsTargetG, foodExclusions]
      properties:
        goal: { $ref: '#/components/schemas/Goal' }
        energyTargetKcal: { type: integer, minimum: 500, maximum: 10000, description: Daily target entered by the user (not calculated). }
        proteinTargetG: { type: number, minimum: 0, maximum: 1000 }
        fatTargetG: { type: number, minimum: 0, maximum: 1000 }
        carbsTargetG: { type: number, minimum: 0, maximum: 1000 }
        foodExclusions:
          type: array
          uniqueItems: true
          description: Permanent exclusions - ingredient codes (Q5).
          items: { $ref: '#/components/schemas/Code' }
    Profile:
      allOf:
        - { $ref: '#/components/schemas/ProfileRequest' }
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }
    DailyConstraintsRequest:
      type: object
      required: [availableTimeMin, availableEquipment, availableIngredients, excludedIngredients]
      properties:
        availableTimeMin: { type: [integer, 'null'], minimum: 0, maximum: 1440, description: Minutes available for remaining activity/preparation; null = not restricted. }
        availableEquipment: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Code' }, description: Equipment available today; empty = none. }
        availableIngredients: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Code' }, description: Ingredients the user has today (Q3). }
        excludedIngredients: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Code' }, description: Temporary exclusions for this day (Q5); must not overlap availableIngredients. }
    DailyConstraints:
      allOf:
        - type: object
          required: [date]
          properties:
            date: { $ref: '#/components/schemas/LocalDate' }
        - { $ref: '#/components/schemas/DailyConstraintsRequest' }
    DailyConstraintsResult:
      type: object
      required: [constraints, planImpact]
      properties:
        constraints: { $ref: '#/components/schemas/DailyConstraints' }
        planImpact:
          type: [object, 'null']
          description: Null when there is no plan for the date.
          required: [planId, recoveryRequired, infeasibleItems]
          properties:
            planId: { type: string, format: uuid }
            recoveryRequired: { type: boolean }
            infeasibleItems:
              type: array
              items:
                type: object
                required: [itemKey, reason]
                properties:
                  itemKey: { type: string, format: uuid }
                  reason: { type: string }

    FoodItem:
      type: object
      required: [foodId, name, source, kcalPer100g, proteinPer100g, fatPer100g, carbsPer100g]
      properties:
        foodId: { type: integer, minimum: 1 }
        name: { type: string }
        source: { type: string, enum: [LOCAL, PROVIDER] }
        kcalPer100g: { type: number, minimum: 0, maximum: 900 }
        proteinPer100g: { type: number, minimum: 0, maximum: 100 }
        fatPer100g: { type: number, minimum: 0, maximum: 100 }
        carbsPer100g: { type: number, minimum: 0, maximum: 100 }
        attribution: { type: [string, 'null'], description: Provider attribution required by its licence (LEG-7). }
    FoodSearchResult:
      type: object
      required: [providerStatus, items]
      properties:
        providerStatus: { type: string, enum: [OK, UNAVAILABLE], description: 'UNAVAILABLE = provider failed; only local results are shown (PROPOSED, AQ-7).' }
        items: { type: array, items: { $ref: '#/components/schemas/FoodItem' } }
    MealCandidate:
      type: object
      required: [mealId, name, mealSlot, prepTimeMin, kcal, proteinG, fatG, carbsG, ingredientCodes]
      properties:
        mealId: { type: integer, minimum: 1 }
        name: { type: string }
        mealSlot: { oneOf: [{ $ref: '#/components/schemas/MealSlot' }, { type: 'null' }], description: Preferred slot; null = any slot. }
        prepTimeMin: { type: integer, minimum: 0, maximum: 600 }
        kcal: { type: number }
        proteinG: { type: number }
        fatG: { type: number }
        carbsG: { type: number }
        ingredientCodes: { type: array, items: { $ref: '#/components/schemas/Code' } }
    FoodEntryRequest:
      type: object
      additionalProperties: false
      required: [date, mealSlot, inputSource, foodName, portionG, kcal, proteinG, fatG, carbsG]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        mealSlot: { $ref: '#/components/schemas/MealSlot' }
        inputSource: { type: string, enum: [CATALOG, MANUAL], description: 'SAVED_MEAL entries are created by POST /saved-meals/{id}/entries. Photo input is post-MVP.' }
        foodId: { type: [integer, 'null'], minimum: 1, description: Required when inputSource = CATALOG. }
        planItemKey: { type: [string, 'null'], format: uuid, description: Planned MEAL of the active version on the same date. }
        foodName: { type: string, minLength: 1, maxLength: 200 }
        portionG: { type: number, exclusiveMinimum: 0, maximum: 5000 }
        kcal: { $ref: '#/components/schemas/Kcal' }
        proteinG: { $ref: '#/components/schemas/Grams' }
        fatG: { $ref: '#/components/schemas/Grams' }
        carbsG: { $ref: '#/components/schemas/Grams' }
    FoodEntryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        mealSlot: { $ref: '#/components/schemas/MealSlot' }
        foodName: { type: string, minLength: 1, maxLength: 200 }
        portionG: { type: number, exclusiveMinimum: 0, maximum: 5000 }
        kcal: { $ref: '#/components/schemas/Kcal' }
        proteinG: { $ref: '#/components/schemas/Grams' }
        fatG: { $ref: '#/components/schemas/Grams' }
        carbsG: { $ref: '#/components/schemas/Grams' }
    FoodEntry:
      type: object
      required: [entryId, date, mealSlot, inputSource, foodId, savedMealId, planItemKey, foodName, portionG, kcal, proteinG, fatG, carbsG, createdAt, updatedAt]
      properties:
        entryId: { type: string, format: uuid }
        date: { $ref: '#/components/schemas/LocalDate' }
        mealSlot: { $ref: '#/components/schemas/MealSlot' }
        inputSource: { type: string, enum: [CATALOG, MANUAL, SAVED_MEAL] }
        foodId: { type: [integer, 'null'] }
        savedMealId: { type: [string, 'null'], format: uuid }
        planItemKey: { type: [string, 'null'], format: uuid }
        foodName: { type: string }
        portionG: { type: number }
        kcal: { type: number }
        proteinG: { type: number }
        fatG: { type: number }
        carbsG: { type: number }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FoodEntryResult:
      type: object
      required: [entry, recoveryRequired]
      properties:
        entry: { $ref: '#/components/schemas/FoodEntry' }
        recoveryRequired: { type: [boolean, 'null'], description: State of the day's plan after the change; null when there is no plan for the date. }
    SavedMealLine:
      type: object
      required: [foodName, portionG, kcal, proteinG, fatG, carbsG]
      properties:
        foodId: { type: [integer, 'null'], minimum: 1 }
        foodName: { type: string, minLength: 1, maxLength: 200 }
        portionG: { type: number, exclusiveMinimum: 0, maximum: 5000 }
        kcal: { $ref: '#/components/schemas/Kcal' }
        proteinG: { $ref: '#/components/schemas/Grams' }
        fatG: { $ref: '#/components/schemas/Grams' }
        carbsG: { $ref: '#/components/schemas/Grams' }
    SavedMealRequest:
      type: object
      additionalProperties: false
      required: [name, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        items: { type: array, minItems: 1, maxItems: 30, items: { $ref: '#/components/schemas/SavedMealLine' } }
    SavedMeal:
      type: object
      required: [savedMealId, name, createdAt, items, totals]
      properties:
        savedMealId: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            allOf:
              - type: object
                required: [lineNo]
                properties: { lineNo: { type: integer, minimum: 1 } }
              - { $ref: '#/components/schemas/SavedMealLine' }
        totals: { $ref: '#/components/schemas/Macros' }
    LogSavedMealRequest:
      type: object
      additionalProperties: false
      required: [date, mealSlot]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        mealSlot: { $ref: '#/components/schemas/MealSlot' }
        planItemKey: { type: [string, 'null'], format: uuid }
    NutritionSummary:
      type: object
      required: [date, consumed, target, remaining, entryCount]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        consumed: { $ref: '#/components/schemas/Macros' }
        target: { $ref: '#/components/schemas/NullableMacros' }
        remaining: { $ref: '#/components/schemas/NullableMacros' }
        entryCount: { type: integer, minimum: 0 }

    PlanItemRef:
      type: object
      required: [itemType, mealSlot, plannedTime, meal, exercise, plannedKcal, plannedProteinG, plannedFatG, plannedCarbsG, durationMin]
      description: 'MEAL items have mealSlot, meal and planned nutrition; WORKOUT items have exercise and durationMin (other fields null).'
      properties:
        itemType: { type: string, enum: [MEAL, WORKOUT] }
        mealSlot: { oneOf: [{ $ref: '#/components/schemas/MealSlot' }, { type: 'null' }] }
        plannedTime: { oneOf: [{ $ref: '#/components/schemas/LocalTime' }, { type: 'null' }] }
        meal:
          type: [object, 'null']
          required: [mealId, name]
          properties: { mealId: { type: integer }, name: { type: string } }
        exercise:
          type: [object, 'null']
          required: [exerciseId, name]
          properties: { exerciseId: { type: integer }, name: { type: string } }
        plannedKcal: { type: [number, 'null'] }
        plannedProteinG: { type: [number, 'null'] }
        plannedFatG: { type: [number, 'null'] }
        plannedCarbsG: { type: [number, 'null'] }
        durationMin: { type: [integer, 'null'], minimum: 1, maximum: 600 }
    PlanItem:
      allOf:
        - type: object
          required: [itemKey, status]
          properties:
            itemKey: { type: string, format: uuid, description: Logical identity across versions. }
            status: { type: string, enum: [PLANNED, COMPLETED, SKIPPED, MISSED, CHANGED] }
        - { $ref: '#/components/schemas/PlanItemRef' }
    Plan:
      type: object
      required: [planId, date, activeVersion, changeReason, versionCreatedAt, recoveryRequired, items]
      properties:
        planId: { type: string, format: uuid }
        date: { $ref: '#/components/schemas/LocalDate' }
        activeVersion: { type: integer, minimum: 1, description: Use as baseVersion for changes and decisions. }
        changeReason: { type: string, enum: [INITIAL_PLAN, MEAL_REPLACEMENT, EXERCISE_REPLACEMENT, RECOVERY_ACCEPTED, RECOVERY_EDITED] }
        versionCreatedAt: { type: string, format: date-time }
        recoveryRequired: { type: boolean }
        items: { type: array, description: Items of the active version sorted by plannedTime (items without time last)., items: { $ref: '#/components/schemas/PlanItem' } }
    PlanItemInput:
      type: object
      additionalProperties: false
      required: [itemType]
      description: 'MEAL: mealSlot + mealId required. WORKOUT: exerciseId + durationMin required. Planned nutrition is taken from the catalogue.'
      properties:
        itemType: { type: string, enum: [MEAL, WORKOUT] }
        mealSlot: { $ref: '#/components/schemas/MealSlot' }
        plannedTime: { $ref: '#/components/schemas/LocalTime' }
        mealId: { type: integer, minimum: 1 }
        exerciseId: { type: integer, minimum: 1 }
        durationMin: { type: integer, minimum: 1, maximum: 600 }
    CreatePlanRequest:
      type: object
      additionalProperties: false
      required: [date, items]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/PlanItemInput' } }
    MealPlanSuggestionRequest:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        mealSlots: { type: array, uniqueItems: true, minItems: 1, items: { $ref: '#/components/schemas/MealSlot' }, description: 'Default: BREAKFAST, LUNCH, DINNER.' }
    MealPlanSuggestion:
      type: object
      required: [date, items, totals, target]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        items:
          type: array
          items:
            type: object
            required: [itemType, mealSlot, mealId, mealName, kcal, proteinG, fatG, carbsG]
            properties:
              itemType: { type: string, const: MEAL }
              mealSlot: { $ref: '#/components/schemas/MealSlot' }
              plannedTime: { $ref: '#/components/schemas/LocalTime' }
              mealId: { type: integer }
              mealName: { type: string }
              kcal: { type: number }
              proteinG: { type: number }
              fatG: { type: number }
              carbsG: { type: number }
        totals: { $ref: '#/components/schemas/Macros' }
        target: { $ref: '#/components/schemas/NullableMacros' }
    Reason:
      type: object
      required: [category, text]
      properties:
        category: { type: string, enum: [NUTRITION, TIME, INGREDIENT, EQUIPMENT, OTHER], description: Constraint the reason is tied to (US-17). }
        text: { type: string, maxLength: 500 }
    ReplacementOptionsRequest:
      type: object
      additionalProperties: false
      required: [planId, itemKey]
      properties:
        planId: { type: string, format: uuid }
        itemKey: { type: string, format: uuid, description: 'A PLANNED item of the active version (MEAL for meal-options, WORKOUT for exercise-options).' }
    MealOptions:
      type: object
      required: [planId, itemKey, baseVersion, options]
      properties:
        planId: { type: string, format: uuid }
        itemKey: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 1 }
        options:
          type: array
          minItems: 1
          items:
            type: object
            required: [mealId, name, kcal, proteinG, fatG, carbsG, prepTimeMin, reasons]
            properties:
              mealId: { type: integer }
              name: { type: string }
              kcal: { type: number }
              proteinG: { type: number }
              fatG: { type: number }
              carbsG: { type: number }
              prepTimeMin: { type: integer }
              reasons: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Reason' } }
    ExerciseOptions:
      type: object
      required: [planId, itemKey, baseVersion, options]
      properties:
        planId: { type: string, format: uuid }
        itemKey: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 1 }
        options:
          type: array
          minItems: 1
          items:
            type: object
            required: [exerciseId, name, durationMin, reasons]
            properties:
              exerciseId: { type: integer }
              name: { type: string }
              durationMin: { type: integer, minimum: 1, maximum: 600 }
              reasons: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Reason' } }
    ReplacementRequest:
      type: object
      additionalProperties: false
      required: [baseVersion]
      description: 'MEAL item: mealId. WORKOUT item: exerciseId and durationMin.'
      properties:
        baseVersion: { type: integer, minimum: 1 }
        mealId: { type: integer, minimum: 1 }
        exerciseId: { type: integer, minimum: 1 }
        durationMin: { type: integer, minimum: 1, maximum: 600 }
    ItemStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [COMPLETED, SKIPPED, MISSED], description: 'MEAL: COMPLETED/SKIPPED/MISSED. WORKOUT: MISSED (other workout outcomes via activity-entries).' }
    Deviation:
      type: object
      required: [deviationId, type, itemKey, kcalDifference, details, detectedAt]
      properties:
        deviationId: { type: string, format: uuid }
        type: { type: string, enum: [KCAL_DIFFERENCE, ITEM_SKIPPED, ITEM_MISSED, CONSTRAINT_INFEASIBLE] }
        itemKey: { type: [string, 'null'], format: uuid }
        kcalDifference: { type: [number, 'null'], description: Actual minus planned kcal (KCAL_DIFFERENCE only). }
        details: { type: [string, 'null'] }
        detectedAt: { type: string, format: date-time }
    ItemStatusResult:
      type: object
      required: [planId, item, recoveryRequired, newDeviations]
      properties:
        planId: { type: string, format: uuid }
        item: { $ref: '#/components/schemas/PlanItem' }
        recoveryRequired: { type: boolean }
        newDeviations: { type: array, items: { $ref: '#/components/schemas/Deviation' } }

    Exercise:
      type: object
      required: [exerciseId, name, metValue, requiredEquipment]
      properties:
        exerciseId: { type: integer, minimum: 1 }
        name: { type: string }
        metValue: { type: number, minimum: 1, maximum: 25, description: MET estimate (LEG-6). }
        requiredEquipment: { type: array, items: { $ref: '#/components/schemas/Code' } }
    ActivityEntryRequest:
      type: object
      additionalProperties: false
      required: [date, exerciseId, status]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        exerciseId: { type: integer, minimum: 1 }
        planItemKey: { type: [string, 'null'], format: uuid, description: Planned WORKOUT of the active version on the same date. }
        status: { type: string, enum: [COMPLETED, SKIPPED, CHANGED] }
        durationMin: { type: [integer, 'null'], minimum: 1, maximum: 600, description: Required for COMPLETED/CHANGED; must be null for SKIPPED. }
      if: { properties: { status: { const: SKIPPED } } }
      then: { properties: { durationMin: { type: 'null' } } }
      else: { required: [durationMin], properties: { durationMin: { type: integer } } }
    ActivityEntry:
      type: object
      required: [entryId, date, exerciseId, exerciseName, planItemKey, status, durationMin, createdAt]
      properties:
        entryId: { type: string, format: uuid }
        date: { $ref: '#/components/schemas/LocalDate' }
        exerciseId: { type: integer }
        exerciseName: { type: string }
        planItemKey: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [COMPLETED, SKIPPED, CHANGED] }
        durationMin: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
    ActivityEntryResult:
      type: object
      required: [entry, recoveryRequired]
      properties:
        entry: { $ref: '#/components/schemas/ActivityEntry' }
        recoveryRequired: { type: [boolean, 'null'] }

    CreateRecoveryProposalRequest:
      type: object
      additionalProperties: false
      properties:
        baseVersion: { type: integer, minimum: 1, description: 'Optional - the version the user is looking at; if it is not the active version, 409.' }
    RecoveryChange:
      type: object
      required: [changeId, changeNo, changeType, targetItemKey, before, after, reason]
      properties:
        changeId: { type: string, format: uuid }
        changeNo: { type: integer, minimum: 1 }
        changeType: { type: string, enum: [REPLACE, REMOVE, ADD] }
        targetItemKey: { type: [string, 'null'], format: uuid, description: Replaced/removed item; null for ADD. }
        before: { oneOf: [{ $ref: '#/components/schemas/PlanItem' }, { type: 'null' }], description: Old value (REPLACE/REMOVE). }
        after: { oneOf: [{ $ref: '#/components/schemas/PlanItemRef' }, { type: 'null' }], description: New value (REPLACE/ADD). }
        reason: { $ref: '#/components/schemas/Reason' }
    RecoveryTotals:
      type: object
      required: [targetKcal, consumedKcal, remainingPlannedKcalBefore, remainingPlannedKcalAfter, forecastKcal]
      properties:
        targetKcal: { type: [number, 'null'] }
        consumedKcal: { type: number, description: From confirmed entries only. }
        remainingPlannedKcalBefore: { type: number, description: Remaining PLANNED meals of the base version. }
        remainingPlannedKcalAfter: { type: number, description: Remaining meals if the proposal is accepted. }
        forecastKcal: { type: number, description: consumedKcal + remainingPlannedKcalAfter. }
    RecoveryProposal:
      type: object
      required: [proposalId, planId, baseVersion, status, createdAt, changes, totals]
      properties:
        proposalId: { type: string, format: uuid }
        planId: { type: string, format: uuid }
        baseVersion: { type: integer, minimum: 1 }
        status: { type: string, enum: [PENDING, STALE, ACCEPTED, EDITED, REJECTED] }
        createdAt: { type: string, format: date-time }
        changes: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RecoveryChange' } }
        totals: { $ref: '#/components/schemas/RecoveryTotals' }
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, baseVersion]
      properties:
        decision: { type: string, enum: [ACCEPT, EDIT, REJECT], description: EDIT is BLOCKED until Q12 is decided. }
        baseVersion: { type: integer, minimum: 1 }
        selectedChangeIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: 'PROVISIONAL, EDIT only (Q12 OPEN): changes of this proposal to apply. Must be absent for ACCEPT and REJECT. Editing values of proposed items is not specified yet.'
          items: { type: string, format: uuid }
    DecisionResult:
      type: object
      required: [proposalId, decision, decidedAt, plan]
      properties:
        proposalId: { type: string, format: uuid }
        decision: { type: string, enum: [ACCEPT, EDIT, REJECT] }
        decidedAt: { type: string, format: date-time }
        plan: { $ref: '#/components/schemas/Plan' }

    DaySummary:
      type: object
      required: [date, plan, nutrition, activity, openItems]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        plan: { oneOf: [{ $ref: '#/components/schemas/Plan' }, { type: 'null' }], description: Active version; null when the day has no plan. }
        nutrition:
          type: object
          required: [plannedKcal, consumedKcal, consumedProteinG, consumedFatG, consumedCarbsG, targetKcal, remainingKcal]
          properties:
            plannedKcal: { type: number }
            consumedKcal: { type: number }
            consumedProteinG: { type: number }
            consumedFatG: { type: number }
            consumedCarbsG: { type: number }
            targetKcal: { type: [number, 'null'] }
            remainingKcal: { type: [number, 'null'] }
        activity:
          type: object
          required: [plannedWorkoutMin, completedWorkoutMin]
          properties:
            plannedWorkoutMin: { type: integer, minimum: 0 }
            completedWorkoutMin: { type: integer, minimum: 0 }
        openItems: { type: integer, minimum: 0, description: PLANNED items of the active version. }
