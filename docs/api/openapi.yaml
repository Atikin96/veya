  /api/v1/recovery-proposals/{proposalId}/decision:
    post:
      tags: [recovery]
      operationId: decideRecoveryProposal
      summary: '[PARTIAL] ACCEPT or REJECT a proposal (EDIT is BLOCKED by Q12)'
      description: |
        Explicit user decision (US-18). The server checks ownership and that `baseVersion` equals both the proposal's
        base version and the active plan version, then:

        * **ACCEPT** - saves the decision **and** the new plan version in one transaction (NFR-09); open deviations are
          resolved and `recoveryRequired` becomes false;
        * **REJECT** - records the decision; the active plan stays unchanged and `recoveryRequired` stays true;
        * **EDIT** - **BLOCKED (Q12 OPEN)**. The database can currently apply a selected subset of the proposal's changes
          (`selectedChangeIds`), but the BA mockup (Fig. B.10) also shows editing the values of individual proposed
          items. The EDIT request schema is therefore not final and must not be implemented by the client yet.

        Stale `baseVersion` -> 409 and nothing changes (NFR-10). Invalid decision or edit -> 400.
      x-veya-status: PARTIAL
      x-veya-module: recovery
      x-veya-stories: [US-18]
      x-veya-acceptance: 'US-18: given a proposal with baseVersion, when a decision is confirmed, then the server checks ownership and version and transactionally applies ACCEPT/EDIT; REJECT leaves active plan unchanged; stale version returns 409.'
      x-veya-contract-source: BA Table 2.8 (200 active plan/version; 409 stale version; 400 invalid edit)
      x-veya-authorization: Authenticated user; another user's proposal -> 403.
      x-veya-notes: 'PARTIAL - ACCEPT and REJECT are implemented; EDIT returns 400 INVALID_EDIT until Q12 is decided. A proposal is decided once: a repeated decision returns 409 PROPOSAL_ALREADY_DECIDED. Concurrent decisions are serialized; exactly one wins (tested).'
      x-veya-open-questions: [Q12 meaning of EDIT (BLOCKED)]
      x-veya-postman:
        - name: ACCEPT the proposal
          expect: 200
          example: accept
          bodyVars: { baseVersion: proposalBaseVersion }
          saveFrom: { planVersion: plan.activeVersion }
        - name: ACCEPT a stale proposal
          expect: 409
          example: staleAccept
          path: { proposalId: '{{staleProposalId}}' }
        - name: Decide the same proposal again
          expect: 409
          example: accept
        - name: REJECT a proposal
          expect: 200
          example: reject
          bodyVars: { baseVersion: proposalBaseVersion }
          path: { proposalId: '{{rejectProposalId}}' }
        - name: Invalid decision value
          expect: 400
          example: invalidDecision
        - name: EDIT a proposal (BLOCKED - Q12 open)
          expect: 200
          example: editProvisional
          bodyVars: { baseVersion: proposalBaseVersion }
          blocked: true
      parameters:
        - { $ref: '#/components/parameters/ProposalId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
            examples:
              accept:
                summary: Accept the whole proposal
                value: { decision: ACCEPT, baseVersion: 1 }
              reject:
                summary: Reject - plan stays unchanged
                value: { decision: REJECT, baseVersion: 1 }
              staleAccept:
                summary: Accept with an outdated base version (409)
                value: { decision: ACCEPT, baseVersion: 1 }
              invalidDecision:
                summary: Unknown decision (400)
                value: { decision: MAYBE, baseVersion: 1 }
              editProvisional:
                summary: 'EDIT - provisional shape, BLOCKED by Q12'
                value: { decision: EDIT, baseVersion: 1, selectedChangeIds: [f1a2b3c4-d5e6-4f70-8192-a3b4c5d6e7f8] }
      responses:
        '200':
          description: Decision recorded; the active plan (new version for ACCEPT, unchanged for REJECT).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResult' }
              examples:
                accepted:
                  value:
                    proposalId: c0000000-0000-4000-8000-000000000001
                    decision: ACCEPT
                    decidedAt: '2026-11-16T18:05:00Z'
                    plan: {"planId": "5e0c7f4a-1b2d-4c3e-9f8a-7b6c5d4e3f21", "date": "2026-11-16", "activeVersion": 2, "changeReason": "RECOVERY_ACCEPTED", "versionCreatedAt": "2026-11-16T18:05:00Z", "recoveryRequired": false, "items": [{"itemKey": "b0000000-0000-4000-8000-000000000201", "itemType": "MEAL", "mealSlot": "BREAKFAST", "plannedTime": "08:00", "meal": {"mealId": 1, "name": "Oatmeal with banana"}, "exercise": null, "plannedKcal": 426.4, "plannedProteinG": 17.2, "plannedFatG": 9.4, "plannedCarbsG": 72.0, "durationMin": null, "status": "COMPLETED"}, {"itemKey": "b0000000-0000-4000-8000-000000000202", "itemType": "MEAL", "mealSlot": "LUNCH", "plannedTime": "13:00", "meal": {"mealId": 4, "name": "Chicken rice bowl"}, "exercise": null, "plannedKcal": 629.9, "plannedProteinG": 54.7, "plannedFatG": 16.4, "plannedCarbsG": 63.0, "durationMin": null, "status": "COMPLETED"}, {"itemKey": "b0000000-0000-4000-8000-000000000204", "itemType": "WORKOUT", "mealSlot": null, "plannedTime": "18:00", "meal": null, "exercise": {"exerciseId": 1, "name": "Running, 10 km/h"}, "plannedKcal": null, "plannedProteinG": null, "plannedFatG": null, "plannedCarbsG": null, "durationMin": 30, "status": "SKIPPED"}, {"itemKey": "b0000000-0000-4000-8000-000000000203", "itemType": "MEAL", "mealSlot": "DINNER", "plannedTime": "19:30", "meal": {"mealId": 8, "name": "Tofu vegetable stir-fry"}, "exercise": null, "plannedKcal": 565.4, "plannedProteinG": 25.4, "plannedFatG": 20.6, "plannedCarbsG": 72.3, "durationMin": null, "status": "PLANNED"}, {"itemKey": "6c7d8e9f-a0b1-4c2d-8e3f-4a5b6c7d8e9f", "itemType": "WORKOUT", "mealSlot": null, "plannedTime": "20:30", "meal": null, "exercise": {"exerciseId": 3, "name": "Bodyweight circuit"}, "plannedKcal": null, "plannedProteinG": null, "plannedFatG": null, "plannedCarbsG": null, "durationMin": 20, "status": "PLANNED"}]}
                rejected:
                  value:
                    proposalId: c0000000-0000-4000-8000-000000000003
                    decision: REJECT
                    decidedAt: '2026-11-16T14:10:00Z'
                    plan: {"planId": "7d8e9fa0-b1c2-4d3e-8f4a-5b6c7d8e9fa0", "date": "2026-11-16", "activeVersion": 1, "changeReason": "INITIAL_PLAN", "versionCreatedAt": "2026-11-15T21:00:00Z", "recoveryRequired": true, "items": [{"itemKey": "b0000000-0000-4000-8000-000000000301", "itemType": "MEAL", "mealSlot": "BREAKFAST", "plannedTime": "07:30", "meal": {"mealId": 1, "name": "Oatmeal with banana"}, "exercise": null, "plannedKcal": 426.4, "plannedProteinG": 17.2, "plannedFatG": 9.4, "plannedCarbsG": 72.0, "durationMin": null, "status": "COMPLETED"}, {"itemKey": "b0000000-0000-4000-8000-000000000302", "itemType": "MEAL", "mealSlot": "LUNCH", "plannedTime": "12:30", "meal": {"mealId": 5, "name": "Pasta bolognese"}, "exercise": null, "plannedKcal": 567.8, "plannedProteinG": 39.4, "plannedFatG": 13.8, "plannedCarbsG": 69.0, "durationMin": null, "status": "COMPLETED"}, {"itemKey": "b0000000-0000-4000-8000-000000000303", "itemType": "WORKOUT", "mealSlot": null, "plannedTime": "17:00", "meal": null, "exercise": {"exerciseId": 5, "name": "Dumbbell strength training"}, "plannedKcal": null, "plannedProteinG": null, "plannedFatG": null, "plannedCarbsG": null, "durationMin": 45, "status": "PLANNED"}]}
        '400':
          description: Invalid decision or invalid edit.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                invalidDecision:
                  value: { type: 'https://veya.example/problems/validation-failed', title: Request is not valid, status: 400, code: VALIDATION_FAILED, detail: One or more fields are invalid., instance: /api/v1/recovery-proposals/c0000000-0000-4000-8000-000000000001/decision, errors: [{ field: decision, message: 'must be one of ACCEPT, EDIT, REJECT', rejectedValue: MAYBE }] }
                invalidEdit:
                  value: { type: 'https://veya.example/problems/invalid-edit', title: Invalid edit, status: 400, code: INVALID_EDIT, detail: Select one or more distinct changes of this proposal., instance: /api/v1/recovery-proposals/c0000000-0000-4000-8000-000000000001/decision }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
