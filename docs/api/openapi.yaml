      responses:
        '200':
          description: Suggested items and totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealPlanSuggestion' }
              example:
                date: '2026-11-17'
                items:
                  - { itemType: MEAL, mealSlot: BREAKFAST, plannedTime: '08:00', mealId: 1, mealName: Oatmeal with banana, kcal: 426.4, proteinG: 17.2, fatG: 9.4, carbsG: 72.0 }
                  - { itemType: MEAL, mealSlot: LUNCH, plannedTime: '13:00', mealId: 4, mealName: Chicken rice bowl, kcal: 629.9, proteinG: 54.7, fatG: 16.4, carbsG: 63.0 }
                  - { itemType: MEAL, mealSlot: DINNER, plannedTime: '19:00', mealId: 9, mealName: Buckwheat with chicken, kcal: 447.0, proteinG: 46.6, fatG: 5.8, carbsG: 52.9 }
                totals: { kcal: 1503.3, proteinG: 118.5, fatG: 31.6, carbsG: 187.9 }
                target: { kcal: 1900, proteinG: 110.0, fatG: 60.0, carbsG: 220.0 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
