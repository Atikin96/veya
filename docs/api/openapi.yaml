                  date: '2026-11-17'
                  items:
                    - { itemType: MEAL, mealSlot: BREAKFAST, plannedTime: '08:00', mealId: 1 }
                    - { itemType: MEAL, mealSlot: LUNCH, plannedTime: '13:00', mealId: 4 }
                    - { itemType: MEAL, mealSlot: DINNER, plannedTime: '19:30', mealId: 7 }
                    - { itemType: WORKOUT, plannedTime: '18:00', exerciseId: 1, durationMin: 30 }
