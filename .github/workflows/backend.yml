name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - "docs/database/**"
      - "docs/api/**"
      - ".github/**"
  pull_request:
    paths:
      - "backend/**"
      - "infra/**"
      - "docs/database/**"
      - "docs/api/**"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: API contract (OpenAPI 3.1 + Postman)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --quiet pyyaml openapi-spec-validator==0.7.1 jsonschema
      - name: Generated files are up to date
        run: |
          python docs/api/tools/build_docs.py
          git diff --exit-code -- docs/api
      - name: Validate contract, examples, Postman collection
        run: python docs/api/tools/check_contract.py

  build:
    name: Build, unit + integration tests, coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Static check: javac -Xlint:all with -Werror (configured in pom.xml) runs as part of every compile.
      - name: Unit tests (no Spring, no database)
        run: ./mvnw -B -ntp test -Dgroups=unit -Djacoco.skip=true

      # All tests (unit + integration against PostgreSQL 17 in Testcontainers), JaCoCo report and coverage gate.
      - name: Integration tests and coverage gate
        run: ./mvnw -B -ntp verify

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          path = "target/site/jacoco/jacoco.csv"
          if not os.path.exists(path):
              print("No JaCoCo report."); raise SystemExit
          rows = list(csv.DictReader(open(path)))
          def total(keep):
              m = {k: sum(int(r[k]) for r in rows if keep(r["PACKAGE"])) for k in
                   ("LINE_MISSED", "LINE_COVERED", "BRANCH_MISSED", "BRANCH_COVERED")}
              pct = lambda c, mm: f"{100 * c / (c + mm):.1f}%"
              return pct(m["LINE_COVERED"], m["LINE_MISSED"]), pct(m["BRANCH_COVERED"], m["BRANCH_MISSED"])
          biz = lambda p: p.endswith(".domain") or p.endswith(".application") or p == "com.veya.planning.api"
          print("| Scope | Line coverage | Branch coverage |\n|---|---|---|")
          print("| Overall | %s | %s |" % total(lambda p: True))
          print("| Business logic | %s | %s |" % total(biz))
          EOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/
          retention-days: 14

      - name: Upload JaCoCo coverage report (HTML, XML, CSV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Dependency vulnerability check (OSV)
        run: |
          ./mvnw -B -ntp -q dependency:list -DincludeScope=runtime -DoutputFile=target/deps.txt
          python3 ../.github/scripts/osv_check.py target/deps.txt

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the production image and start PostgreSQL + API (Docker Compose)
        run: |
          sh infra/generate-env.sh
          docker compose -f infra/docker-compose.yml --profile app up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q UP; then echo "API ready"; exit 0; fi
            sleep 3
          done
          docker compose -f infra/docker-compose.yml --profile app logs api
          exit 1
      - name: API smoke test (UC-01 end to end)
        shell: pwsh
        run: ./infra/smoke/smoke-test.ps1 -BaseUrl http://127.0.0.1:8080
      - name: Stop
        if: always()
        run: docker compose -f infra/docker-compose.yml --profile app down -v
