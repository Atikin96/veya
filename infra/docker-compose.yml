# VEYA infrastructure: PostgreSQL 17 and (profile "app") the API container.
# Usage (from the repository root):
#   docker compose -f infra/docker-compose.yml up -d                       # database only (development)
#   docker compose -f infra/docker-compose.yml --profile app up -d --build  # database + API on :8080
# Passwords are never stored in the repository: create infra/.env (git-ignored) first with
#   sh infra/generate-env.sh
#
# Role provisioning (infra/postgres/initdb) runs only when the data volume is created for the first
# time. After changing roles or passwords, recreate the volume (see README, "Database").

name: veya

services:
  postgres:
    image: postgres:17-alpine
    container_name: veya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VEYA_DB_NAME:-veya}
      # Bootstrap superuser: used only by the init script and for maintenance, never by the API.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${VEYA_POSTGRES_PASSWORD:?run sh infra/generate-env.sh first}
      VEYA_OWNER_PASSWORD: ${VEYA_OWNER_PASSWORD:?run sh infra/generate-env.sh first}
      VEYA_APP_PASSWORD: ${VEYA_APP_PASSWORD:?run sh infra/generate-env.sh first}
      VEYA_READONLY_PASSWORD: ${VEYA_READONLY_PASSWORD:?run sh infra/generate-env.sh first}
      VEYA_ADMIN_PASSWORD: ${VEYA_ADMIN_PASSWORD:?run sh infra/generate-env.sh first}
    ports:
      # Host port 5433 by default so it does not clash with a locally installed PostgreSQL on 5432. Bound to the
      # loopback interface only: the database is never reachable from other machines.
      - "127.0.0.1:${VEYA_DB_PORT:-5433}:5432"
    volumes:
      - veya-postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/seed:/veya/seed:ro
      - ./postgres/scripts:/veya/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: veya-api:local
    container_name: veya-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      VEYA_DB_URL: jdbc:postgresql://postgres:5432/${VEYA_DB_NAME:-veya}?currentSchema=veya
      VEYA_APP_PASSWORD: ${VEYA_APP_PASSWORD:?run sh infra/generate-env.sh first}
      VEYA_OWNER_PASSWORD: ${VEYA_OWNER_PASSWORD:?run sh infra/generate-env.sh first}
      VEYA_JWT_SECRET: ${VEYA_JWT_SECRET:?run sh infra/generate-env.sh first}
      VEYA_CORS_ALLOWED_ORIGINS: ${VEYA_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      VEYA_FOOD_PROVIDER_ENABLED: ${VEYA_FOOD_PROVIDER_ENABLED:-false}
    ports:
      - "${VEYA_API_BIND:-127.0.0.1}:${VEYA_API_PORT:-8080}:8080"

volumes:
  veya-postgres-data:
