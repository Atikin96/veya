spring:
  application:
    name: veya-backend

  # Passwords are not stored in the repository. Locally they come from infra/.env (created by
  # infra/generate-env.sh, git-ignored, imported below when the API is started from backend/);
  # elsewhere from environment variables. The API connects as veya_app_user (no DDL, no superuser);
  # Flyway migrates as veya_owner.
  config:
    import: optional:file:../infra/.env[.properties]

  datasource:
    url: ${VEYA_DB_URL:jdbc:postgresql://localhost:5433/veya?currentSchema=veya}
    username: ${VEYA_DB_USERNAME:veya_app_user}
    password: ${VEYA_APP_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: veya

  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${VEYA_FLYWAY_USERNAME:veya_owner}
    password: ${VEYA_OWNER_PASSWORD}
    default-schema: veya
    schemas: veya

server:
  port: ${VEYA_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
