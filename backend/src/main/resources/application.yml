spring:
  application:
    name: veya-backend

  # Defaults match infra/docker-compose.yml (host port 5433 avoids clashing with a locally installed PostgreSQL).
  # Override with VEYA_DB_URL / VEYA_DB_USERNAME / VEYA_DB_PASSWORD in any other environment.
  datasource:
    url: ${VEYA_DB_URL:jdbc:postgresql://localhost:5433/veya}
    username: ${VEYA_DB_USERNAME:veya}
    password: ${VEYA_DB_PASSWORD:veya}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${VEYA_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
